plugins {
  id "com.vanniktech.maven.publish" version "0.32.0"
}

repositories {
    mavenCentral()
}

apply plugin: 'java'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'
apply plugin: 'signing'

targetCompatibility='1.8'
sourceCompatibility='1.8'

group 'org.freeplane.dpolivaev.mnemonicsetter'
version='0.7-SNAPSHOT'

dependencies {
	testImplementation 'junit:junit:4.12',
					'org.hamcrest:hamcrest-all:1.3',
					'org.mockito:mockito-all:1.10.19'  
}

import com.vanniktech.maven.publish.SonatypeHost
import com.vanniktech.maven.publish.JavaLibrary
import com.vanniktech.maven.publish.JavadocJar

mavenPublishing {
  configure(new JavaLibrary(new JavadocJar.Javadoc(), true))
  publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL)

  signAllPublications()
  
    pom {
        name = project.name
        description = 'Automatically assigns mnemonics to menu items and toolbar elements'
        url = 'https://github.com/dpolivaev/mnemonicsetter'

        scm {
            url = 'https://github.com/dpolivaev/mnemonicsetter'
            connection = 'scm:git:https://github.com/dpolivaev/mnemonicsetter.git'
            developerConnection = 'scm:git:git@github.com:dpolivaev/mnemonicsetter.git'
        }

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
            }
        }

        developers {
            developer {
                id = 'dpolivaev'
                name = 'Dimitry Polivaev'
                email = 'dpolivaev@gmx.de'
            }
        }
    }
}

publishing {
    repositories {
        maven { 
			 url  = "${project.gradle.gradleUserHomeDir}/local-artifacts"
		}
    }
}

signing {
    sign publishing.publications.maven
}

